<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Checker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Yelmo · Málaga</p>
        <h1>Movie Checker</h1>
        <p class="subtitle">English-language (VOSE) movies playing today.</p>
      </div>
      <button id="refresh" type="button">Refresh</button>
    </header>

    <p id="status" class="status">Loading Yelmo showtimes…</p>
    <section id="cinemas" aria-live="polite"></section>
  </main>

  <script>
    const cinemasEl = document.querySelector('#cinemas');
    const statusEl = document.querySelector('#status');
    const refreshButton = document.querySelector('#refresh');

    const escapeHtml = (value) => String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');

    const safeUrl = (value) => {
      try {
        const url = new URL(value);
        return ['http:', 'https:'].includes(url.protocol) ? url.href : '#';
      } catch {
        return '#';
      }
    };

    function render(data) {
      const cinemas = data.cinemas || [];
      const total = cinemas.reduce((sum, cinema) => sum + (cinema.movies || []).length, 0);

      statusEl.textContent = total
        ? `${total} English-language ${total === 1 ? 'movie' : 'movies'} found · updated ${new Date(data.updated_at).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}`
        : 'No English-language (VOSE) sessions found right now.';

      cinemasEl.innerHTML = cinemas.map((cinema) => {
        const movies = cinema.movies || [];
        if (!movies.length) return '';

        return `
          <section class="cinema">
            <div class="cinema-heading">
              <h2>${escapeHtml(cinema.name)}</h2>
              <a href="${safeUrl(cinema.url)}" target="_blank" rel="noreferrer">Yelmo ↗</a>
            </div>
            <div class="movie-list">
              ${movies.map((movie) => `
                <article class="movie">
                  <div class="movie-copy">
                    <a class="movie-title" href="${safeUrl(movie.url)}" target="_blank" rel="noreferrer">
                      ${escapeHtml(movie.title)}
                    </a>
                    <span class="badge">${escapeHtml(movie.language)}</span>
                  </div>
                  <div class="times" aria-label="Showtimes for ${escapeHtml(movie.title)}">
                    ${(movie.showtimes || []).map((showtime) => `
                      <a class="time" href="${safeUrl(showtime.url)}" target="_blank" rel="noreferrer" title="Open this ${escapeHtml(showtime.time)} session on Yelmo">
                        ${escapeHtml(showtime.time)}
                      </a>
                    `).join('')}
                  </div>
                </article>
              `).join('')}
            </div>
          </section>
        `;
      }).join('');

      if (data.warnings?.length) {
        statusEl.textContent += ' Some cinema data could not be loaded.';
      }
    }

    async function load(force = false) {
      refreshButton.disabled = true;
      statusEl.textContent = force ? 'Refreshing Yelmo showtimes…' : 'Loading Yelmo showtimes…';
      try {
        const response = await fetch(`/api/movies${force ? '?refresh=1' : ''}`, { cache: 'no-store' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not load Yelmo');
        render(data);
      } catch (error) {
        cinemasEl.innerHTML = '';
        statusEl.textContent = `Could not load showtimes: ${error.message}`;
      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener('click', () => load(true));
    load();
  </script>
</body>
</html>
