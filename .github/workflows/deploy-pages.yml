name: Refresh movies and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: movie-checker-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp site/index.html _site/index.html
          cp site/styles.css _site/styles.css
          touch _site/.nojekyll
          python generate_data.py --output _site/data/movies.json

      - name: Verify published data has usable content
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('_site/data/movies.json').read_text())
          cities = data.get('cities') or []
          movies = [m for c in cities for cinema in c.get('cinemas', []) for m in cinema.get('movies', [])]
          sessions = [s for m in movies for d in m.get('dates', []) for s in d.get('showtimes', [])]
          dates = {d.get('date') for m in movies for d in m.get('dates', []) if d.get('showtimes')}
          print(f"movies={len(movies)} dates={len(dates)} sessions={len(sessions)} source_status={data.get('source_status')}")
          if data.get('source_status') != 'ok' or not movies or not sessions:
              raise SystemExit('No usable English-language movie data was produced')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
