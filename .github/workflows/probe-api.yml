name: Probe Cinépolis ES API

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: movie-checker-api-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python probe_api.py
      - uses: actions/upload-artifact@v4
        with:
          name: cinepolis-api-probe
          path: probe-output.json
          retention-days: 1
