<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="English-language Yelmo screenings by city, date and cinema.">
  <title>Movie Checker</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Yelmo · English screenings</p>
        <h1>Movie Checker</h1>
        <p class="subtitle">Only movies that actually have English-language sessions.</p>
      </div>
      <button id="reload" type="button">Reload</button>
    </header>

    <div class="controls">
      <label for="city">City</label>
      <select id="city"></select>
    </div>

    <p id="status" class="status">Loading latest published showtimes…</p>
    <section id="movies" class="movie-list" aria-live="polite"></section>
  </main>

  <script>
    const moviesEl = document.querySelector('#movies');
    const statusEl = document.querySelector('#status');
    const cityEl = document.querySelector('#city');
    const reloadButton = document.querySelector('#reload');
    let payload = null;

    const escapeHtml = (value) => String(value ?? '')
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    const safeUrl = (value) => {
      try {
        const url = new URL(value);
        return ['http:', 'https:'].includes(url.protocol) ? url.href : '#';
      } catch { return '#'; }
    };

    const formatDate = (value) => {
      if (!value) return 'Date';
      const d = /^\d{4}-\d{2}-\d{2}/.test(value) ? new Date(`${value.slice(0,10)}T12:00:00`) : null;
      return d && !Number.isNaN(d.valueOf())
        ? d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' })
        : value;
    };

    function normalizeCities(data) {
      if (Array.isArray(data.cities)) return data.cities;
      return [{ id: 'malaga', name: 'Málaga', cinemas: data.cinemas || [] }];
    }

    function aggregateMovies(city) {
      const map = new Map();
      for (const cinema of city.cinemas || []) {
        for (const movie of cinema.movies || []) {
          const key = (movie.id || movie.title || '').toString().toLocaleLowerCase('es-ES');
          if (!key) continue;
          if (!map.has(key)) map.set(key, {
            id: movie.id || key,
            title: movie.title,
            url: movie.url,
            language: movie.language || 'VOSE',
            dates: new Map(),
          });
          const target = map.get(key);
          for (const day of movie.dates || []) {
            if (!target.dates.has(day.date)) target.dates.set(day.date, []);
            const rows = target.dates.get(day.date);
            for (const s of day.showtimes || []) {
              const row = {
                cinema: cinema.name,
                cinemaUrl: cinema.url,
                time: s.time,
                datetime: s.datetime,
                url: s.url || movie.url || cinema.url,
              };
              if (!rows.some(x => x.cinema === row.cinema && x.time === row.time && x.url === row.url)) rows.push(row);
            }
          }
        }
      }
      return [...map.values()]
        .filter(movie => [...movie.dates.values()].some(rows => rows.length))
        .sort((a,b) => a.title.localeCompare(b.title));
    }

    function renderCity() {
      const cities = normalizeCities(payload || {});
      const city = cities.find(c => String(c.id) === cityEl.value) || cities[0];
      if (!city) return;
      const movies = aggregateMovies(city);
      const updated = payload?.updated_at ? new Date(payload.updated_at) : null;
      const updatedText = updated && !Number.isNaN(updated.valueOf())
        ? updated.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : 'unknown time';

      statusEl.textContent = movies.length
        ? `${movies.length} English-language ${movies.length === 1 ? 'movie' : 'movies'} in ${city.name} · updated ${updatedText}`
        : `No English-language sessions published for ${city.name} · updated ${updatedText}`;

      moviesEl.innerHTML = movies.map(movie => {
        const days = [...movie.dates.entries()].sort(([a],[b]) => String(a).localeCompare(String(b)));
        return `
          <article class="movie">
            <div class="movie-heading-row">
              <a class="movie-title" href="${safeUrl(movie.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(movie.title)}</a>
              <span class="badge">${escapeHtml(movie.language)}</span>
            </div>
            <div class="schedule">
              ${days.map(([date, rows]) => `
                <section class="day-block">
                  <h2 class="day-label">${escapeHtml(formatDate(date))}</h2>
                  <div class="sessions">
                    ${rows.sort((a,b) => (a.time || '').localeCompare(b.time || '') || a.cinema.localeCompare(b.cinema)).map(s => `
                      <a class="session" href="${safeUrl(s.url)}" target="_blank" rel="noopener noreferrer">
                        <span class="session-cinema">${escapeHtml(s.cinema)}</span>
                        <span class="session-time">${escapeHtml(s.time)}</span>
                      </a>
                    `).join('')}
                  </div>
                </section>
              `).join('')}
            </div>
          </article>`;
      }).join('');
    }

    function render(data) {
      payload = data;
      const cities = normalizeCities(data);
      cityEl.innerHTML = cities.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join('');
      const malaga = cities.find(c => /m[aá]laga/i.test(c.name));
      if (malaga) cityEl.value = String(malaga.id);
      renderCity();
    }

    async function load() {
      reloadButton.disabled = true;
      statusEl.textContent = 'Loading latest published showtimes…';
      try {
        const response = await fetch(`./data/movies.json?v=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
      } catch (error) {
        moviesEl.innerHTML = '';
        statusEl.textContent = `Could not load published showtimes: ${error.message}`;
      } finally { reloadButton.disabled = false; }
    }

    cityEl.addEventListener('change', renderCity);
    reloadButton.addEventListener('click', load);
    load();
  </script>
</body>
</html>
